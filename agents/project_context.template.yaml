# project_context.template.yaml
# Copy to project_context.yaml. The project file is local and gitignored.
# Do not place literal secrets here; use references to protected config/env files.
#
# v2 uses a minimal envelope and visible profile selection. Inactive profiles
# impose no fields. schema_version: 2 is required; missing or unsupported
# versions are unusable and require explicit reinitialization or conversion.

schema_version: 2

project:
  name:
  description:

profiles:
  selected: []       # e.g. [code], [non_code], or [code, odoo]
  inferred: []       # signals found by init-project; review and correct selected

  code:
    layout:
      source_dir:
      docs_dir:
      summary_file: PROJECT_SUMMARY.md
    spec:
      docs_repo:
      customer_facing_dir:
      current_tag:
    commands:
      install:
      build:
      lint:
      typecheck:
      format:
      test:
    filesystem:
      external_paths: []  # path + reason; authorization remains in opencode.json

  non_code:
    acceptance:
      criteria: []
      evidence:
    research:
      sources: []
      findings: []
    layout:
      docs_dir:
      summary_file: PROJECT_SUMMARY.md

  odoo:
    version:
    source:
      base:
      enterprise:
    scripts:
      start:
      run_tests:
      config_ini:       # reference to a protected config file, not credentials
    qa_instance:
      config_ini:       # reference to a protected config file
    modules: []

# Controlled, self-describing project-specific additions. Preserve unknown
# extension keys in valid v2 files; do not reinterpret them.
extensions: {}
